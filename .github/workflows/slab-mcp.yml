# Path-filtered so one tool's red build never blocks another's, per CONTRIBUTING.md.
name: slab-mcp

on:
  push:
    branches: [main]
    paths: ['slab-mcp/**', '.github/workflows/slab-mcp.yml']
  pull_request:
    paths: ['slab-mcp/**', '.github/workflows/slab-mcp.yml']

defaults:
  run:
    working-directory: slab-mcp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: slab-mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Pure and offline — no network, no API key, no server.
      - run: npm test
      - run: npm run build
